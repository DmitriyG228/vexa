# Benchmark stack for pack ei-agent — separate from the product compose stack.
# Brings up the LiteLLM proxy (the customer-local LLM gateway stand-in) on its own
# network. Agent containers are started per-run by run.sh and join this network.
#
# Required env (injected by run.sh — never written to disk):
#   MISTRAL_API_KEY     — from vexa-secrets via bin/secret (sanctioned seam)
#   LITELLM_MASTER_KEY  — local-only shared secret (auto-generated by run.sh)
name: vexa-bench
services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:?set via bin/secret no-prod/mistral.enc.env MISTRAL_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?run via run.sh}
    volumes:
      - ./litellm/config.yaml:/etc/litellm/config.yaml:ro
    ports:
      - "127.0.0.1:4400:4000"
    networks: [bench]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3).status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30

networks:
  bench:
    name: vexa-bench
