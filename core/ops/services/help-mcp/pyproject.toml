[project]
name = "vexa-help-mcp"
version = "0.12.0"
description = "The vexa help companion (v0.12) — a public-facing MCP service users' coding agents connect to while deploying/integrating vexa. Answers from two ALWAYS-LABELED knowledge tiers: 'doc' (cited from the shipped docs corpus by path + heading, indexed in-memory with ~100 lines of stdlib — no search dependency) and 'operational' (live GitHub triage state behind a 15-minute TTL cache). Read-only v1: it mutates ONLY its own help:questions telemetry stream (the doc-gap feedback loop the ops workspace reviews) and, config-gated behind HELP_GITHUB_TOKEN, escalation issues on the public tracker; escalations also emit a help.escalated event.v1 to agent-api /events (best-effort). Every degrade path is visible, never a crashed answer."
requires-python = ">=3.11"
dependencies = [
    # FastAPI app + the MCP mount. fastapi-mcp is MIT (tadata-org/fastapi_mcp); it brings the
    # official `mcp` python SDK (MIT) — both Category A per ADR-0004.
    "fastapi>=0.110,<1",
    "fastapi-mcp>=0.4.0,<0.5",
    # GitHub + agent-api transport (BSD-3).
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
    # The help:questions telemetry stream (MIT).
    "redis>=5,<6",
    # Test harness (in-process, no network/docker): fake GitHub + agent-api via
    # httpx.MockTransport, fake redis via fakeredis, and schema-by-path conformance of the
    # dispatched help.escalated envelope against the sealed event.v1 (P4/P8).
    "pytest>=8",
    "fakeredis>=2.20,<3",
    "jsonschema>=4,<5",
    "referencing>=0.30,<0.40",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
