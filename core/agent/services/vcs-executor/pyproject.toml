[project]
name = "vexa-vcs-executor"
version = "0.12.0"
description = "The credentialed executor (v0.12) — the privileged half of the proposal.v1 human gate. XREADGROUPs human-APPROVED proposals off the proposal:approved redis stream, re-validates them (schema by path + the structural level<->action binding + fail-loud branch policy, all BEFORE any credential exists), mints a per-proposal GitHub App installation token scoped to the target repo and the proposal's level, executes exactly the approved action (L2 REST annotate; L3 git am/commit -> push -> PR), and reports the result to agent-api's /internal/proposals/{id}/executed sink — agent-api stays the single writer of proposal state. The ONLY holder of GitHub credentials in the system; it interprets nothing."
requires-python = ">=3.11"
dependencies = [
    # The /health front door + lifespan-managed consumer (MIT) + the GitHub/agent-api transport (BSD-3).
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    # XREADGROUP/XACK on proposal:approved (MIT).
    "redis>=5,<6",
    # GitHub App auth: the RS256 app JWT (PyJWT, MIT) signed with the App private key
    # (cryptography, Apache-2.0/BSD-3). Both FINOS Category A (ADR-0004).
    "pyjwt>=2.8,<3",
    "cryptography>=42,<47",
    # Shipped-path conformance: an approved proposal is re-validated against the sealed
    # proposal.v1 schema BY PATH before execution (P8) — prod deps, not test-only.
    "jsonschema>=4,<5",
    "referencing>=0.30,<0.40",
    # Test harness (in-process, no network/docker): fake agent-api + GitHub via
    # httpx.MockTransport, fake redis via fakeredis, local bare repos for the git flow.
    "pytest>=8",
    "fakeredis>=2.20,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
